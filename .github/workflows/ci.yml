name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Run daily at midnight UTC
    - cron: "0 0 * * *"

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "20"
  CACHE_VERSION: "v1"  # Increment to invalidate caches

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  proto-check:
    name: Proto Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc-gen-go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Verify proto stubs are up to date
        run: |
          # Generate fresh proto files
          mkdir -p internal/proto
          protoc --go_out=internal/proto --go_opt=paths=source_relative \
            --go-grpc_out=internal/proto --go-grpc_opt=paths=source_relative \
            api/proto/*.proto
          # Check if there are any differences
          if ! git diff --exit-code internal/proto/; then
            echo "::error::Proto stubs are out of date. Run 'make proto' and commit the changes."
            exit 1
          fi
          echo "Proto stubs are up to date"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test -race -short -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=57
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below minimum threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets minimum threshold ${THRESHOLD}%"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  systemd-tests:
    name: Systemd Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run systemd tests
        run: go test -v -tags=systemd ./init/...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    services:
      ssh:
        image: linuxserver/openssh-server
        env:
          PUID: 1000
          PGID: 1000
          TZ: UTC
          PASSWORD_ACCESS: "true"
          USER_NAME: testuser
          USER_PASSWORD: testpass
        ports:
          - 2222:2222
        options: >-
          --health-cmd="nc -z localhost 2222"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run integration tests
        run: go test -tags=integration -race -v ./tests/integration/...
        env:
          TEST_SSH_HOST: localhost
          TEST_SSH_PORT: 2222
          TEST_SSH_USER: testuser
          TEST_SSH_PASS: testpass
          TESTCONTAINERS_RYUK_DISABLED: true

  build:
    name: Build (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, freebsd]
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build vcdeploy
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o vcdeploy-${{ matrix.os }}-${{ matrix.arch }} ./cmd/vcdeploy

      - name: Build vcdeploy-agent
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o vcdeploy-agent-${{ matrix.os }}-${{ matrix.arch }} ./cmd/vcdeploy-agent

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            vcdeploy-${{ matrix.os }}-${{ matrix.arch }}*
            vcdeploy-agent-${{ matrix.os }}-${{ matrix.arch }}*
          retention-days: 7

  goreleaser-check:
    name: Validate GoReleaser Config
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check

      - name: Build snapshot (dry-run)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=publish

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (master)
        id: meta-master
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/master
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push master
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-master.outputs.tags }}
          labels: ${{ steps.meta-master.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Docker meta (agent)
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/agent
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.agent
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 30

  # E2E API Tests
  e2e-api:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build application
        run: make build

      - name: Start test server
        run: |
          mkdir -p data
          ln -sf ../web/templates data/templates
          ln -sf ../web/static data/static
          ./bin/vcdeploy master start --config=configs/master-dev.yaml &
          sleep 15  # Wait for server to start
        env:
          VCDEPLOY_TEST_MODE: "true"
          VCDEPLOY_ADMIN_PASSWORD: "Admin@Password123!"
          VCDEPLOY_DATA_DIR: "./data"
          VCDEPLOY_CONFIG_DIR: "./configs"
          VCDEPLOY_RUN_DIR: "./data"
          VCDEPLOY_LOG_DIR: "./data"

      - name: Run E2E API tests
        run: go test -v -tags=e2e -timeout 20m ./tests/e2e/...
        env:
          E2E_MASTER_HTTP_URL: "http://localhost:9000"
          E2E_API_TOKEN: ""
          E2E_ADMIN_USER: "admin"
          E2E_ADMIN_PASS: "Admin@Password123!"

  # CLI Tests
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build application
        run: make build

      - name: Verify binary exists
        run: |
          ls -la bin/
          ./bin/vcdeploy version

      - name: Start master server
        run: |
          docker compose -f docker/docker-compose.test.yml up -d master
          # Wait for master to be healthy (check health endpoint)
          echo "Waiting for master to be ready..."
          for i in {1..30}; do
            if curl -sf http://localhost:9000/api/v1/health > /dev/null 2>&1; then
              echo "Master is ready!"
              break
            fi
            echo "Attempt $i/30: Master not ready yet, waiting..."
            sleep 2
          done
          # Final check
          curl -sf http://localhost:9000/api/v1/health || (docker compose -f docker/docker-compose.test.yml logs master && exit 1)
        env:
          TEST_ADMIN_PASSWORD: "Admin@Password123!"

      - name: Check master status
        run: |
          docker compose -f docker/docker-compose.test.yml ps
          curl -s http://localhost:9000/api/v1/health || true

      - name: Run CLI tests
        run: go test -v -tags=cli -timeout 15m ./tests/cli/...
        env:
          VCDEPLOY_BINARY: "./bin/vcdeploy"
          E2E_MASTER_HTTP_URL: "http://localhost:9000"
          E2E_API_TOKEN: "test-api-token"
          E2E_ADMIN_PASS: "Admin@Password123!"
          SKIP_AGENT_TESTS: "1"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.test.yml logs master

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  # UI Tests (Playwright)
  ui-tests:
    name: UI Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright dependencies
        run: |
          cd tests/ui
          npm ci
          npx playwright install --with-deps chromium

      - name: Build application
        run: make build

      - name: Start test server
        run: |
          mkdir -p data
          ln -sf ../web/templates data/templates
          ln -sf ../web/static data/static
          ./bin/vcdeploy master start --config=configs/master-dev.yaml &
          sleep 15
        env:
          VCDEPLOY_TEST_MODE: "true"
          VCDEPLOY_ADMIN_PASSWORD: "Admin@Password123!"
          VCDEPLOY_DATA_DIR: "./data"
          VCDEPLOY_CONFIG_DIR: "./configs"
          VCDEPLOY_RUN_DIR: "./data"
          VCDEPLOY_LOG_DIR: "./data"

      - name: Run Playwright tests
        run: |
          cd tests/ui
          npx playwright test --project=chromium
        env:
          VCDEPLOY_WEB_URL: "http://localhost:9000"
          TEST_ADMIN_USERNAME: "admin"
          TEST_ADMIN_PASSWORD: "Admin@Password123!"
          CI: "true"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/ui/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: tests/ui/test-results/
          retention-days: 7

  # Full E2E with Docker (main branch only)
  full-e2e:
    name: Full E2E (Docker)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start test infrastructure
        run: |
          docker compose -f docker/docker-compose.test.yml up -d --build
          sleep 60  # Wait for all services to be ready
        env:
          TEST_ADMIN_PASSWORD: "Admin@Password123!"

      - name: Check infrastructure status
        run: docker compose -f docker/docker-compose.test.yml ps

      - name: Run E2E API tests
        run: go test -v -tags=e2e -timeout 30m ./tests/e2e/...
        env:
          E2E_MASTER_HTTP_URL: "http://localhost:9000"
          E2E_ADMIN_PASS: "Admin@Password123!"

      - name: Build CLI binary
        run: make build

      - name: Run CLI tests
        run: go test -v -tags=cli -timeout 15m ./tests/cli/...
        env:
          VCDEPLOY_BINARY: "./bin/vcdeploy"
          E2E_MASTER_HTTP_URL: "http://localhost:9000"
          E2E_ADMIN_PASS: "Admin@Password123!"

      - name: Install Playwright
        run: |
          cd tests/ui
          npm ci
          npx playwright install --with-deps chromium

      - name: Run UI tests
        run: |
          cd tests/ui
          npx playwright test --project=chromium
        env:
          VCDEPLOY_WEB_URL: "http://localhost:9000"
          TEST_ADMIN_PASSWORD: "Admin@Password123!"
          CI: "true"

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.test.yml logs

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  # SBOM Generation (main branch only)
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Generate SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          mkdir -p sbom
          cyclonedx-gomod mod -json -output sbom/sbom.json
          cyclonedx-gomod mod -output sbom/sbom.xml

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          retention-days: 30

  # Final status check for branch protection
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, test, systemd-tests, integration, build, goreleaser-check, e2e-api, cli-tests, ui-tests]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "::error::Lint failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "::error::Tests failed"
            exit 1
          fi
          if [[ "${{ needs.systemd-tests.result }}" != "success" ]]; then
            echo "::error::Systemd tests failed"
            exit 1
          fi
          if [[ "${{ needs.integration.result }}" != "success" ]]; then
            echo "::error::Integration tests failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build failed"
            exit 1
          fi
          if [[ "${{ needs.goreleaser-check.result }}" != "success" ]]; then
            echo "::error::GoReleaser check failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-api.result }}" != "success" ]]; then
            echo "::error::E2E API tests failed"
            exit 1
          fi
          if [[ "${{ needs.cli-tests.result }}" != "success" ]]; then
            echo "::error::CLI tests failed"
            exit 1
          fi
          if [[ "${{ needs.ui-tests.result }}" != "success" ]]; then
            echo "::error::UI tests failed"
            exit 1
          fi
          echo "All CI checks passed!"
