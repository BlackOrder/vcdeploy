name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Download dependencies
        run: go mod download
          
      - name: Run unit tests
        run: go test -v -race -short -coverprofile=coverage-unit.out ./...
        
      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.out
          retention-days: 5

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          
      - name: Run govulncheck
        run: govulncheck ./...
        
      - name: Run gosec
        run: gosec -fmt=sarif -out=gosec-results.sarif ./...
        continue-on-error: true
        
      - name: Upload gosec SARIF
        uses: github/codeql-action/upload-sarif@v4
        # Don't fail on fork PRs which can't access security-events API
        continue-on-error: true
        if: always()
        with:
          sarif_file: gosec-results.sarif

  systemd-tests:
    name: Systemd Validation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Verify systemd-analyze is available
        run: |
          which systemd-analyze || echo "systemd-analyze not found, tests may skip verification"
          
      - name: Run systemd tests
        run: go test -v -tags=systemd ./init/...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      # Docker-in-Docker for testcontainers
      dind:
        image: docker:dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Download dependencies
        run: go mod download
        
      - name: Run integration tests
        run: go test -v -race -tags=integration ./...
        env:
          TESTCONTAINERS_RYUK_DISABLED: true
          DOCKER_HOST: unix:///var/run/docker.sock

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          
      - name: Generate coverage report
        run: |
          go tool cover -func=coverage-unit.out
          go tool cover -html=coverage-unit.out -o coverage.html
          
      - name: Upload coverage HTML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 30
          
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage-unit.out
          flags: unittests
          fail_ci_if_error: false

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build test images
        run: |
          if [ -f docker-compose.test.yaml ]; then
            docker-compose -f docker-compose.test.yaml build
          else
            echo "No docker-compose.test.yaml found, skipping e2e tests"
            exit 0
          fi
          
      - name: Start test environment
        run: |
          if [ -f docker-compose.test.yaml ]; then
            docker-compose -f docker-compose.test.yaml up -d
            # Wait for services to be ready
            sleep 10
          fi
          
      - name: Run e2e tests
        run: |
          if [ -f docker-compose.test.yaml ]; then
            go test -v -tags=e2e ./tests/e2e/...
          fi
          
      - name: Cleanup test environment
        if: always()
        run: |
          if [ -f docker-compose.test.yaml ]; then
            docker-compose -f docker-compose.test.yaml down -v --remove-orphans
          fi
          
      - name: Upload e2e test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/e2e-*.log
          retention-days: 5

  test-matrix:
    name: Test Matrix (Go ${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        go-version: ['1.25']
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          
      - name: Run tests
        run: go test -v -race -short ./...

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          
      - name: Run benchmarks
        run: go test -v -bench=. -benchmem -run=^$ ./... | tee benchmark.txt
        
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.txt
          retention-days: 30

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [unit-tests, systemd-tests, integration-tests, test-matrix, security-scan]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "Unit tests failed: ${{ needs.unit-tests.result }}"
            exit 1
          fi
          if [[ "${{ needs.systemd-tests.result }}" != "success" ]]; then
            echo "Systemd tests failed: ${{ needs.systemd-tests.result }}"
            exit 1
          fi
          if [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "Integration tests failed: ${{ needs.integration-tests.result }}"
            exit 1
          fi
          if [[ "${{ needs.test-matrix.result }}" != "success" ]]; then
            echo "Test matrix failed: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          # Security scan is allowed to fail on fork PRs (SARIF upload requires permissions)
          if [[ "${{ needs.security-scan.result }}" != "success" && "${{ needs.security-scan.result }}" != "failure" ]]; then
            echo "Security scan skipped or cancelled: ${{ needs.security-scan.result }}"
            exit 1
          fi
          echo "All tests passed!"
