run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  enable-all: false
  enable:
    # Default linters - must fix
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Security - important
    - gosec
    # Code quality - medium priority
    - bodyclose
    - durationcheck
    - errorlint
    - gofmt
    - goimports
    - misspell
    - nilerr
    - sqlclosecheck
    - unconvert
    - whitespace

linters-settings:
  errcheck:
    check-type-assertions: false
    check-blank: false
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - (net.Conn).Close
      - (*database/sql.Rows).Close
      - (*database/sql.DB).Close
      - (*go.uber.org/zap.Logger).Sync
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Printf
      - fmt.Println

  govet:
    enable-all: false
    enable:
      - assign
      - atomic
      - bools
      - buildtag
      - copylocks
      - httpresponse
      - loopclosure
      - lostcancel
      - nilfunc
      - printf
      - shift
      - stdmethods
      - structtag
      - tests
      - unmarshal
      - unreachable
      - unusedresult

  gosec:
    excludes:
      - G104  # Unhandled errors (covered by errcheck)
      - G204  # Subprocess launched with variable
      - G304  # File path from variable
      - G301  # Directory permissions
      - G302  # File permissions
      - G306  # WriteFile permissions
      - G115  # Integer overflow conversion (acceptable for our use case)
    severity: medium
    confidence: medium

  misspell:
    locale: US
    ignore-words:
      - cancelled  # British spelling used in proto and consistency

issues:
  exclude-use-default: true
  max-issues-per-linter: 50
  max-same-issues: 10

  exclude-rules:
    # Test files - more lenient
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - bodyclose
        - errorlint  # Tests often compare errors directly
        - nilerr

    # Generated protobuf files
    - path: \.pb\.go$
      linters:
        - all

    # Command files - allow flag errors and intentional nil returns
    - path: cmd/
      linters:
        - errcheck
        - nilerr  # CLI often returns nil on expected errors to show user-friendly message

    # Main files
    - path: main\.go
      linters:
        - errcheck

    # Allow Sync errors on logger
    - linters:
        - errcheck
      text: "Sync"

    # io.EOF is commonly checked with ==
    - linters:
        - errorlint
      text: "io.EOF"

    # Exclude nilerr for specific patterns (user-friendly CLI messages)
    - linters:
        - nilerr
      source: "return nil // "

    # Exclude nilerr for settings service defaults
    - linters:
        - nilerr
      source: "return defaultVal, nil"

    # TOTP uses SHA1 by spec - required for compatibility
    - path: internal/security/totp\.go
      linters:
        - gosec
      text: "G505"

    # SSH insecure ignore is behind explicit user flag
    - path: internal/deploy/ssh\.go
      linters:
        - gosec
      text: "G106"

    # Allow misspell in proto enum names and consistency
    - linters:
        - misspell
      text: "cancell"

    # Allow os.ErrProcessDone direct comparison (stdlib sentinel)
    - linters:
        - errorlint
      text: "os.ErrProcessDone"

    # Allow double wrapping pattern in errors
    - linters:
        - errorlint
      source: "nolint:errorlint"

    # Storage db.go intentional format
    - path: internal/storage/db\.go
      linters:
        - errorlint
      text: "non-wrapping"

    # Executor release number returns
    - path: internal/deploy/executor\.go
      linters:
        - nilerr

