# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: vcdeploy

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: vcdeploy
    main: ./cmd/vcdeploy
    binary: vcdeploy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: vcdeploy-agent
    main: ./cmd/vcdeploy-agent
    binary: vcdeploy-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - init/systemd/*
      - init/launchd/*
      - init/openrc/*
      - init/freebsd/*

dockers:
  - id: master-amd64
    ids:
      - vcdeploy
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/blackorder/vcdeploy:{{ .Tag }}-amd64"
    dockerfile: docker/Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

  - id: master-arm64
    ids:
      - vcdeploy
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/blackorder/vcdeploy:{{ .Tag }}-arm64"
    dockerfile: docker/Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

  - id: agent-amd64
    ids:
      - vcdeploy-agent
    goos: linux
    goarch: amd64
    image_templates:
      - "ghcr.io/blackorder/vcdeploy-agent:{{ .Tag }}-amd64"
    dockerfile: docker/Dockerfile.agent
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}-agent"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

  - id: agent-arm64
    ids:
      - vcdeploy-agent
    goos: linux
    goarch: arm64
    image_templates:
      - "ghcr.io/blackorder/vcdeploy-agent:{{ .Tag }}-arm64"
    dockerfile: docker/Dockerfile.agent
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}-agent"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

docker_manifests:
  - name_template: "ghcr.io/blackorder/vcdeploy:{{ .Tag }}"
    image_templates:
      - "ghcr.io/blackorder/vcdeploy:{{ .Tag }}-amd64"
      - "ghcr.io/blackorder/vcdeploy:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/blackorder/vcdeploy:latest"
    image_templates:
      - "ghcr.io/blackorder/vcdeploy:{{ .Tag }}-amd64"
      - "ghcr.io/blackorder/vcdeploy:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/blackorder/vcdeploy-agent:{{ .Tag }}"
    image_templates:
      - "ghcr.io/blackorder/vcdeploy-agent:{{ .Tag }}-amd64"
      - "ghcr.io/blackorder/vcdeploy-agent:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/blackorder/vcdeploy-agent:latest"
    image_templates:
      - "ghcr.io/blackorder/vcdeploy-agent:{{ .Tag }}-amd64"
      - "ghcr.io/blackorder/vcdeploy-agent:{{ .Tag }}-arm64"

nfpms:
  - id: packages
    package_name: vcdeploy
    vendor: BlackOrder
    homepage: https://github.com/BlackOrder/vcdeploy
    maintainer: VCDeploy Team <vcdeploy@blackorder.dev>
    description: Deployment platform with master-agent architecture
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      # Systemd service files
      - src: ./init/systemd/vcdeploy-master.service
        dst: /lib/systemd/system/vcdeploy-master.service
        type: config
        packager: deb
      - src: ./init/systemd/vcdeploy-master.service
        dst: /usr/lib/systemd/system/vcdeploy-master.service
        type: config
        packager: rpm
      - src: ./init/systemd/vcdeploy-agent.service
        dst: /lib/systemd/system/vcdeploy-agent.service
        type: config
        packager: deb
      - src: ./init/systemd/vcdeploy-agent.service
        dst: /usr/lib/systemd/system/vcdeploy-agent.service
        type: config
        packager: rpm
      # Config directory
      - dst: /etc/vcdeploy
        type: dir
        file_info:
          mode: 0750
      # Data directory
      - dst: /var/lib/vcdeploy
        type: dir
        file_info:
          mode: 0755
      # Log directory
      - dst: /var/log/vcdeploy
        type: dir
        file_info:
          mode: 0755
    scripts:
      postinstall: ./scripts/postinstall.sh
      preremove: ./scripts/preremove.sh
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package
    rpm:
      group: System Environment/Daemons

brews:
  - name: vcdeploy
    repository:
      owner: BlackOrder
      name: homebrew-vcdeploy
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/BlackOrder/vcdeploy
    description: Deployment platform with master-agent architecture
    license: Apache-2.0
    install: |
      bin.install "vcdeploy"
      bin.install "vcdeploy-agent"
    test: |
      system "#{bin}/vcdeploy", "version"
    caveats: |
      To get started with VCDeploy:
        vcdeploy init
        vcdeploy master start

      For more information, visit:
        https://github.com/BlackOrder/vcdeploy

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "🔒 Security"
      regexp: '^.*?sec(\(.+\))??!?:.+$'
      order: 2
    - title: "📦 Dependencies"
      regexp: '^.*?deps(\(.+\))??!?:.+$'
      order: 3
    - title: "📚 Documentation"
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 4
    - title: "🏗️ Other"
      order: 999

release:
  github:
    owner: BlackOrder
    name: vcdeploy
  draft: false
  prerelease: auto
  mode: replace
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## VCDeploy v{{.Version}}

    ### Installation

    **Linux/macOS (curl):**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/BlackOrder/vcdeploy/main/scripts/install.sh | bash
    ```

    **Homebrew (macOS/Linux):**
    ```bash
    brew tap BlackOrder/vcdeploy
    brew install vcdeploy
    ```

    **Docker:**
    ```bash
    docker pull ghcr.io/blackorder/vcdeploy:{{ .Tag }}
    ```

    **Direct Download:**
    Download the appropriate binary for your platform from the assets below.

  footer: |
    **Full Changelog**: https://github.com/BlackOrder/vcdeploy/compare/{{.PreviousTag}}...{{.Tag}}

# Announce new releases
announce:
  skip: '{{ gt (len .Prerelease) 0 }}'
