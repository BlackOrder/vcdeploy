# VCDeploy Agent Test Configuration
# Used for E2E testing

agent:
  id: "test-agent"
  name: "test-agent"
  labels:
    env: test
    region: local
    os: linux

master:
  address: "master:9001"
  token: "test-registration-token"  # Auto-registration token for test mode
  cert: ""  # Explicitly disable TLS cert (use allow_insecure instead)
  allow_insecure: true

heartbeat:
  interval: 5s

deploy:
  work_dir: "/deploy"
  cleanup: true

logging:
  level: debug
  format: json
  output: stdout
