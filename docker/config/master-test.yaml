# VCDeploy Master Test Configuration
# Used for E2E testing

server:
  listen: ":9000"
  tls:
    enabled: false

grpc:
  listen: ":9001"
  tls:
    enabled: false

database:
  driver: sqlite
  dsn: "/var/lib/vcdeploy/vcdeploy-test.db"

auth:
  jwt:
    secret: "test-jwt-secret-key-for-e2e-testing-only"
    expiry: 24h
  session:
    timeout: 24h

admin:
  username: admin
  # Password is set via VCDEPLOY_ADMIN_PASSWORD env var (defaults to Admin@Password123!)

logging:
  level: debug
  format: json
  output: stdout

features:
  audit_logging: true
  webhooks: true
  api_keys: true

webhook:
  secret: "test-webhook-secret"

api:
  rate_limit:
    enabled: false

test_mode: true

# Archive settings (test)
archive:
  storage_dir: /var/lib/vcdeploy/archives
  keep_count: 5
  max_total_size: 1GB
  signed_url_expiry: 10m
