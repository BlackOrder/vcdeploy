# VCDeploy Master Test Configuration
# Used for E2E testing

server:
  listen: ":8080"
  tls:
    enabled: false

grpc:
  listen: ":9090"
  tls:
    enabled: false

database:
  driver: sqlite
  dsn: "/var/lib/vcdeploy/vcdeploy-test.db"

auth:
  jwt:
    secret: "test-jwt-secret-key-for-e2e-testing-only"
    expiry: 24h
  session:
    timeout: 24h

admin:
  username: admin
  # Password is set via VCDEPLOY_ADMIN_PASSWORD env var (defaults to adminpassword123)

logging:
  level: debug
  format: json
  output: stdout

features:
  audit_logging: true
  webhooks: true
  api_keys: true

webhook:
  secret: "test-webhook-secret"

rate_limit:
  enabled: false

test_mode: true
