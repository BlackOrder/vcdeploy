openapi: 3.1.0
info:
  title: vcdeploy API
  description: |
    REST API for vcdeploy - a modern deployment orchestration platform.
    
    ## Authentication
    
    Most endpoints require authentication via one of:
    - Session cookie (for web UI)
    - Bearer token in `Authorization` header (for API access)
    - API key in `X-API-Key` header
    
    ## Rate Limiting
    
    API requests are rate limited. When exceeded, endpoints return `429 Too Many Requests`.
    
    ## Request IDs
    
    All requests receive an `X-Request-ID` header for correlation and debugging.
  version: 1.0.0
  license:
    name: MIT
    url: https://github.com/BlackOrder/vcdeploy/blob/main/LICENSE
  contact:
    name: BlackOrder
    url: https://github.com/BlackOrder/vcdeploy

servers:
  - url: http://localhost:9000
    description: Local development server
  - url: https://vcdeploy.example.com
    description: Production server (example)

tags:
  - name: Health
    description: Health check endpoints
  - name: Auth
    description: Authentication endpoints
  - name: Users
    description: User management
  - name: TOTP
    description: Two-factor authentication management
  - name: Projects
    description: Project management
  - name: Deployments
    description: Deployment operations
  - name: Agents
    description: Agent management
  - name: Secrets
    description: Secret management
  - name: Settings
    description: System settings
  - name: Webhooks
    description: Webhook endpoints

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Returns 200 if the process is alive. Used for Kubernetes liveness probes.
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /livez:
    get:
      tags: [Health]
      summary: Liveness probe (alias)
      description: Alias for /healthz. Returns 200 if the process is alive. Used for Kubernetes liveness probes.
      operationId: getLivenessAlias
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Returns 200 if the server can serve traffic, 503 otherwise. Used for Kubernetes readiness probes.
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Server is ready
          content:
            text/plain:
              schema:
                type: string
                example: ok
        '503':
          description: Server is not ready
          content:
            text/plain:
              schema:
                type: string
                example: database not ready

  /api/v1/health:
    get:
      tags: [Health]
      summary: Detailed health status
      description: Returns detailed health information including database, gRPC, and agent status.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Health status (may be healthy, degraded, or unhealthy)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Unhealthy status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics for monitoring.
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticate with username and password to obtain a session token.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT token for API access
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # TOTP (Two-Factor Authentication) Endpoints
  /api/v1/totp/setup:
    post:
      tags: [TOTP]
      summary: Start TOTP setup
      description: Generate a new TOTP secret for the authenticated user to set up 2FA.
      operationId: totpSetup
      responses:
        '200':
          description: TOTP secret generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: Base32-encoded TOTP secret
                    example: JBSWY3DPEHPK3PXP
                  uri:
                    type: string
                    description: otpauth URI for QR code generation
                    example: otpauth://totp/vcdeploy:admin?secret=JBSWY3DPEHPK3PXP&issuer=vcdeploy
        '400':
          description: TOTP is already enabled
        '401':
          description: Unauthorized

  /api/v1/totp/enable:
    post:
      tags: [TOTP]
      summary: Enable TOTP
      description: Verify and enable TOTP for the authenticated user. Returns recovery codes.
      operationId: totpEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret, totp_code]
              properties:
                secret:
                  type: string
                  description: The TOTP secret from setup
                totp_code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: 6-digit TOTP code to verify setup
      responses:
        '200':
          description: TOTP enabled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  recovery_codes:
                    type: array
                    items:
                      type: string
                    description: One-time recovery codes (XXXX-XXXX format)
        '400':
          description: TOTP already enabled or invalid request
        '401':
          description: Invalid TOTP code

  /api/v1/totp/disable:
    post:
      tags: [TOTP]
      summary: Disable TOTP (self-service)
      description: Disable TOTP for the authenticated user. Requires current TOTP verification.
      operationId: totpDisable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Current 6-digit TOTP code
      responses:
        '200':
          description: TOTP disabled successfully
        '400':
          description: TOTP not enabled
        '401':
          description: Invalid TOTP code

  /api/v1/totp/recovery/regenerate:
    post:
      tags: [TOTP]
      summary: Regenerate recovery codes
      description: Generate new recovery codes, invalidating all previous codes.
      operationId: regenerateRecoveryCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [totp_code]
              properties:
                totp_code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Current 6-digit TOTP code for verification
      responses:
        '200':
          description: Recovery codes regenerated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  recovery_codes:
                    type: array
                    items:
                      type: string
                  warning:
                    type: string
        '400':
          description: TOTP not enabled
        '401':
          description: Invalid TOTP code

  /api/v1/admin/totp/users:
    get:
      tags: [TOTP]
      summary: List users with TOTP enabled
      description: Returns all users who have TOTP enabled (admin only).
      operationId: listTotpUsers
      responses:
        '200':
          description: List of TOTP-enabled users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                        totpEnabled:
                          type: boolean
        '403':
          description: Admin access required

  /api/v1/admin/totp/status/{username}:
    get:
      tags: [TOTP]
      summary: Get user TOTP status
      description: Returns TOTP status for a specific user including recovery code count (admin only).
      operationId: getTotpStatus
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User TOTP status
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  username:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                  totp_enabled:
                    type: boolean
                  recovery_codes_remaining:
                    type: integer
        '403':
          description: Admin access required
        '404':
          description: User not found

  /api/v1/admin/totp/disable:
    post:
      tags: [TOTP]
      summary: Disable TOTP for user (admin)
      description: Admin action to disable TOTP for a user who has lost access. Logged for audit.
      operationId: adminDisableTotp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, reason]
              properties:
                username:
                  type: string
                  description: Username to disable TOTP for
                reason:
                  type: string
                  minLength: 10
                  description: Reason for disabling (for audit)
                totp_code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: Admin's TOTP code (required if admin has TOTP enabled)
      responses:
        '200':
          description: TOTP disabled successfully
        '400':
          description: Invalid request or user doesn't have TOTP
        '401':
          description: Invalid admin TOTP code
        '403':
          description: Admin access required or cannot disable own TOTP
        '404':
          description: User not found

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Returns a paginated list of all users (admin only).
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              example:
                items:
                  - id: 1
                    username: "admin"
                    email: "admin@example.com"
                    role: "admin"
                    createdAt: "2024-01-15T10:30:00Z"
                total: 1
                page: 1
                pageSize: 20
                hasMore: false
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: true
                message: "admin access required"
    post:
      tags: [Users]
      summary: Create user
      description: Create a new user (admin only).
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      description: Returns a paginated list of all projects.
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
              example:
                items:
                  - id: "proj-123"
                    name: "my-app"
                    repository: "https://github.com/user/app"
                    branch: "main"
                    deployPath: "/var/www/app"
                    createdAt: "2024-01-15T10:30:00Z"
                total: 1
                page: 1
                pageSize: 20
                hasMore: false
    post:
      tags: [Projects]
      summary: Create project
      description: Create a new project.
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict - project already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Projects]
      summary: Get project
      description: Get a project by ID.
      operationId: getProject
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Projects]
      summary: Update project
      description: Update a project.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Projects]
      summary: Delete project
      description: Delete a project.
      operationId: deleteProject
      responses:
        '204':
          description: Project deleted
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/deployments:
    get:
      tags: [Deployments]
      summary: List deployments
      description: Returns a list of deployments with optional filtering.
      operationId: listDeployments
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
          description: Filter by project ID
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, success, failed, cancelled]
          description: Filter by status
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of results
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Offset for pagination
      responses:
        '200':
          description: List of deployments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deployment'
    post:
      tags: [Deployments]
      summary: Create deployment
      description: Start a new deployment for a project.
      operationId: createDeployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentCreate'
      responses:
        '201':
          description: Deployment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/deployments/{deploymentId}:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Deployments]
      summary: Get deployment
      description: Get deployment details by ID.
      operationId: getDeployment
      responses:
        '200':
          description: Deployment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/deployments/{deploymentId}/cancel:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Deployments]
      summary: Cancel deployment
      description: Cancel a running deployment.
      operationId: cancelDeployment
      responses:
        '200':
          description: Deployment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'
        '400':
          description: Deployment cannot be cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/deployments/{deploymentId}/logs:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Deployments]
      summary: Get deployment logs
      description: Get logs for a deployment.
      operationId: getDeploymentLogs
      parameters:
        - name: after_id
          in: query
          schema:
            type: integer
          description: Return logs after this ID (for polling)
      responses:
        '200':
          description: Deployment logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeploymentLog'
        '404':
          description: Deployment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: List agents
      description: Returns a paginated list of all registered agents.
      operationId: listAgents
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: Paginated list of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
              example:
                items:
                  - id: "agent-001"
                    name: "prod-agent-1"
                    host: "192.168.1.100"
                    status: "connected"
                    lastSeen: "2024-01-15T10:30:00Z"
                total: 1
                page: 1
                pageSize: 20
                hasMore: false

  /api/v1/agents/{agentId}:
    parameters:
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Agents]
      summary: Get agent
      description: Get agent details by ID.
      operationId: getAgent
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Agents]
      summary: Delete agent
      description: Delete an agent registration.
      operationId: deleteAgent
      responses:
        '204':
          description: Agent deleted
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/secrets:
    get:
      tags: [Secrets]
      summary: List secrets
      description: Returns a list of secret keys (values are not exposed).
      operationId: listSecrets
      parameters:
        - name: project
          in: query
          schema:
            type: string
          description: Filter by project
        - name: scope
          in: query
          schema:
            type: string
            enum: [global, project, environment]
          description: Filter by scope
      responses:
        '200':
          description: List of secrets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Secret'
    post:
      tags: [Secrets]
      summary: Create secret
      description: Create or update a secret.
      operationId: createSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
      responses:
        '201':
          description: Secret created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Secret'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/secrets/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [Secrets]
      summary: Delete secret
      description: Delete a secret.
      operationId: deleteSecret
      parameters:
        - name: project
          in: query
          schema:
            type: string
          description: Project scope
        - name: scope
          in: query
          schema:
            type: string
            enum: [global, project, environment]
          description: Secret scope
      responses:
        '204':
          description: Secret deleted
        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhook/github/{project}:
    post:
      tags: [Webhooks]
      summary: GitHub webhook
      description: Receive webhook events from GitHub for a specific project.
      operationId: handleGitHubWebhook
      security: []
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
          description: Project name
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
          description: HMAC signature for verification
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
          description: Event type (push, pull_request, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhook/gitlab/{project}:
    post:
      tags: [Webhooks]
      summary: GitLab webhook
      description: Receive webhook events from GitLab for a specific project.
      operationId: handleGitLabWebhook
      security: []
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
          description: Project name
        - name: X-Gitlab-Token
          in: header
          required: true
          schema:
            type: string
          description: Secret token for verification
        - name: X-Gitlab-Event
          in: header
          required: true
          schema:
            type: string
          description: Event type (Push Hook, Merge Request Hook, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /webhook/bitbucket/{project}:
    post:
      tags: [Webhooks]
      summary: Bitbucket webhook
      description: Receive webhook events from Bitbucket for a specific project.
      operationId: handleBitbucketWebhook
      security: []
      parameters:
        - name: project
          in: path
          required: true
          schema:
            type: string
          description: Project name
        - name: X-Event-Key
          in: header
          required: true
          schema:
            type: string
          description: Event type (repo:push, pullrequest:created, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        '400':
          description: Invalid webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/api-keys:
    get:
      tags: [Auth]
      summary: List API keys
      description: Returns a list of API keys for the authenticated user.
      operationId: listAPIKeys
      responses:
        '200':
