      bearerFormat: JWT
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key

  # Pagination parameters - standardized on offset/limit
  parameters:
    OffsetParam:
      name: offset
      in: query
      description: Number of items to skip for pagination
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    LimitParam:
      name: limit
      in: query
      description: Maximum number of items to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    # Deprecated aliases for backward compatibility during transition
    PageParam:
      name: page
      in: query
      deprecated: true
      description: "(Deprecated, use offset) Page number (1-indexed)"
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
    PageSizeParam:
      name: pageSize
      in: query
      deprecated: true
      description: "(Deprecated, use limit) Number of items per page"
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

  schemas:
    # H7 FIX: Error schema now matches actual ErrorResponse type in responses.go
    Error:
      type: object
      description: Standard error response for all API endpoints
      required:
        - error
        - message
      properties:
        error:
          type: boolean
          description: Always true for error responses
          example: true
        message:
          type: string
          description: Human-readable error message
          example: "Invalid request parameters"

    # Standardized pagination response schema using offset/limit
    PaginatedResponse:
      type: object
      description: Standard pagination response format
      properties:
        items:
          type: array
          description: List of items for current page
          items: {}
        totalCount:
          type: integer
          format: int64
          description: Total number of items across all results
          example: 100
        offset:
          type: integer
          description: Number of items skipped
          example: 0
        limit:
          type: integer
          description: Maximum items returned per request
          example: 20

    # Deprecated - kept for documentation reference
    PaginationMeta:
      type: object
      deprecated: true
      description: "(Deprecated) Use PaginatedResponse instead"
      properties:
        total:
          type: integer
          format: int64
          description: Total number of items across all pages
          example: 100
        page:
          type: integer
          description: Current page number (1-indexed)
          example: 1
        pageSize:
          type: integer
          description: Number of items per page
          example: 20
        hasMore:
          type: boolean
          description: Whether there are more pages available
          example: true

    # H8 FIX: Paginated user list response
    UserListResponse:
      type: object
      description: Paginated list of users
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

    # H8 FIX: Paginated project list response
    ProjectListResponse:
      type: object
      description: Paginated list of projects
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

    # H8 FIX: Paginated agent list response
    AgentListResponse:
      type: object
      description: Paginated list of agents
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
        hasMore:
          type: boolean

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CheckResult'
        timestamp:
          type: string
          format: date-time

    CheckResult:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        message:
          type: string
        latency:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user, viewer]
        createdAt:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user, viewer]
          default: user
        totpEnabled:
          type: boolean
          default: false
          description: Enable TOTP 2FA for this user
        totp_secret:
          type: string
          description: TOTP secret (required if totp_enabled is true)

    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        repository:
          type: string
        branch:
          type: string
        deployPath:
          type: string
        projectTypeId:
          type: string
        agents:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectCreate:
      type: object
      required: [name, repository]
      properties:
        name:
          type: string
        description:
          type: string
        repository:
          type: string
        branch:
          type: string
          default: main
        deployPath:
          type: string
        projectTypeId:
          type: string
        agents:
          type: array
          items:
            type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        repository:
          type: string
        branch:
          type: string
        deployPath:
          type: string
        projectTypeId:
          type: string
        agents:
          type: array
          items:
            type: string

    Deployment:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        projectName:
          type: string
        status:
          type: string
          enum: [pending, running, success, failed, cancelled]
        version:
          type: string
        commit:
          type: string
        triggeredBy:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        errorMessage:
          type: string

    DeploymentCreate:
      type: object
      required: [projectId]
      properties:
        projectId:
          type: string
        version:
          type: string
        commit:
          type: string
        force:
          type: boolean
          default: false

    DeploymentLog:
      type: object
      properties:
        id:
          type: integer
        deploymentId:
          type: string
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [info, warn, error]
        message:
          type: string
        source:
          type: string

    Agent:
      type: object
      properties:
        id:
          type: string
        hostname:
          type: string
        status:
          type: string
          enum: [online, offline, unknown]
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        registeredAt:
          type: string
          format: date-time
        labels:
          type: object
          additionalProperties:
            type: string
        stats:
          type: object
          properties:
            cpuPercent:
              type: number
            memoryPercent:
              type: number
            diskPercent:
              type: number

    Secret:
      type: object
      properties:
        key:
          type: string
        project:
          type: string
        scope:
          type: string
          enum: [global, project, environment]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SecretCreate:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string
          format: password
        project:
          type: string
        scope:
          type: string
          enum: [global, project, environment]
          default: global

    APIKey:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        prefix:
          type: string
          description: First characters of the key for identification
        scopes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    APIKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        scopes:
          type: array
          items:
            type: string
          default: ["*"]
        expiresInDays:
          type: integer
          description: Number of days until expiry (0 = never)
          default: 0

    APIKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/APIKey'
        - type: object
          properties:
            key:
              type: string
              description: The full API key (only shown once at creation)

    ProjectType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        buildCommand:
          type: string
        deployCommand:
          type: string
        healthCheckPath:
          type: string
        createdAt:
          type: string
          format: date-time

    ProjectTypeCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
        buildCommand:
          type: string
        deployCommand:
          type: string
        healthCheckPath:
          type: string

    AuditEntry:
      type: object
      properties:
        id:
          type: integer
        timestamp:
          type: string
          format: date-time
        user:
          type: string
        action:
          type: string
        resource:
          type: string
        resourceId:
          type: string
        details:
          type: string
        ipAddress:
          type: string
        result:
          type: string
          enum: [success, failure]

    Stats:
      type: object
      properties:
        totalProjects:
          type: integer
        totalDeployments:
          type: integer
        successfulDeployments:
          type: integer
        failedDeployments:
          type: integer
        activeAgents:
          type: integer
        totalAgents:
          type: integer
        deploymentsToday:
          type: integer
        deploymentsThisWeek:
          type: integer

    HostKey:
      type: object
      properties:
        id:
          type: integer
        hostname:
          type: string
        port:
          type: integer
        keyType:
          type: string
        publicKey:
          type: string
        fingerprint:
          type: string
        trusted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastVerifiedAt:
          type: string
          format: date-time

    HostKeyCreate:
      type: object
      required: [hostname, keyType, publicKey]
      properties:
        hostname:
          type: string
        port:
          type: integer
          default: 22
        keyType:
          type: string
        publicKey:
          type: string
        fingerprint:
          type: string
        trusted:
          type: boolean
          default: false

    JumpServer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        hostname:
          type: string
        port:
          type: integer
        username:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    JumpServerCreate:
      type: object
      required: [name, hostname, username]
      properties:
        name:
          type: string
        hostname:
          type: string
        port:
          type: integer
          default: 22
        username:
          type: string
        privateKey:
          type: string
          format: password
        enabled:
          type: boolean
          default: true

    BlockedIP:
      type: object
      properties:
        id:
          type: integer
        ipAddress:
          type: string
        blockedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        reason:
          type: string
        manualBlock:
          type: boolean

    BlockIPRequest:
      type: object
      required: [ipAddress]
      properties:
        ipAddress:
          type: string
        reason:
          type: string
        duration:
          type: string
          description: Duration string (e.g., "1h", "24h", "7d")

    ProvisionJob:
      type: object
      properties:
        id:
          type: string
        targetHost:
          type: string
        targetPort:
          type: integer
        targetUser:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled]
        output:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    ProvisionJobCreate:
      type: object
      required: [targetHost, targetUser]
      properties:
        targetHost:
          type: string
        targetPort:
          type: integer
          default: 22
        targetUser:
          type: string
        jumpServerId:
          type: integer
          description: Optional jump server to use

    Rollback:
      type: object
      properties:
        id:
          type: string
        projectId:
          type: string
        fromDeploymentId:
          type: string
        toDeploymentId:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        reason:
          type: string
        triggeredBy:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    AgentBinary:
      type: object
      properties:
        id:
          type: string
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        filename:
          type: string
        size:
          type: integer
        checksum:
          type: string
        uploadedAt:
          type: string
          format: date-time

    HealthCheckConfig:
      type: object
      properties:
        projectId:
          type: string
        enabled:
          type: boolean
        url:
          type: string
        method:
          type: string
          enum: [GET, POST, HEAD]
          default: GET
        timeoutSeconds:
          type: integer
          default: 30
        retries:
          type: integer
          default: 3
        retryDelaySeconds:
          type: integer
          default: 5
        expectedStatus:
          type: integer
          default: 200
        bodyContains:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        autoRollbackEnabled:
          type: boolean
          default: false
        autoRollbackReleases:
          type: integer
          default: 1

security:
  - bearerAuth: []
  - apiKey: []
