{{range .CAs}}
<div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700 last:border-b-0">
    <div class="flex-1">
        <div class="flex items-center gap-2">
            <span class="font-medium">{{.CommonName}}</span>
            {{if .IsCurrent}}
            <span class="px-2 py-0.5 text-xs rounded bg-green-200 text-green-800 dark:bg-green-800 dark:text-green-200">Current</span>
            {{else}}
            <span class="px-2 py-0.5 text-xs rounded bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-400">Previous</span>
            {{end}}
        </div>
        <div class="text-sm text-gray-500 dark:text-gray-400 mt-1">
            Version {{.Version}} • Valid: {{.NotBefore | formatDate}} - {{.NotAfter | formatDate}}
        </div>
    </div>
    <div class="text-right">
        <div class="text-sm font-mono text-gray-500 dark:text-gray-400">
            {{.ID | truncate 12}}
        </div>
        {{if isExpiringSoon .NotAfter}}
        <span class="text-xs text-yellow-600">Expiring soon</span>
        {{end}}
    </div>
</div>
{{else}}
<div class="p-4 text-center text-gray-500">
    No certificate authorities found
</div>
{{end}}
