{{template "base" .}}

{{define "content"}}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold">Projects</h1>
        <button onclick="document.getElementById('new-project-modal').classList.remove('hidden')"
            class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-accent-600 hover:bg-accent-700">
            <svg class="mr-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
            </svg>
            New Project
        </button>
    </div>

    <!-- Search and Filter -->
    <div class="flex space-x-4">
        <div class="flex-1">
            <input type="text" placeholder="Search projects..." 
                hx-get="/api/v1/projects" hx-trigger="keyup changed delay:500ms" hx-target="#projects-list"
                name="search"
                class="block w-full px-3 py-2 bg-dark-card border border-dark-border rounded-md text-dark-text placeholder-dark-muted focus:outline-none focus:ring-2 focus:ring-accent-500">
        </div>
        <select class="px-3 py-2 bg-dark-card border border-dark-border rounded-md text-dark-text focus:outline-none focus:ring-2 focus:ring-accent-500">
            <option value="">All Types</option>
            <option value="laravel">Laravel</option>
            <option value="nodejs">Node.js</option>
            <option value="python">Python</option>
            <option value="static">Static</option>
        </select>
    </div>

    <!-- Projects List -->
    <div id="projects-list" hx-get="/api/v1/projects" hx-trigger="load" hx-swap="innerHTML">
        <div class="text-center py-12 text-dark-muted">
            <span class="animate-pulse">Loading projects...</span>
        </div>
    </div>
</div>

<!-- New Project Modal -->
<div id="new-project-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-dark-card border border-dark-border rounded-lg max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
        <div class="px-6 py-4 border-b border-dark-border flex items-center justify-between">
            <h3 class="text-lg font-medium">New Project</h3>
            <button onclick="document.getElementById('new-project-modal').classList.add('hidden')" class="text-dark-muted hover:text-white">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <form hx-post="/api/v1/projects" hx-target="#projects-list" hx-swap="innerHTML" 
            hx-on="htmx:afterRequest: if(event.detail.successful) document.getElementById('new-project-modal').classList.add('hidden')">
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-dark-muted mb-1">Project Name</label>
                    <input type="text" name="name" required
                        class="block w-full px-3 py-2 bg-dark-bg border border-dark-border rounded-md text-dark-text focus:outline-none focus:ring-2 focus:ring-accent-500"
                        placeholder="my-awesome-app">
                </div>
                <div>
                    <label class="block text-sm font-medium text-dark-muted mb-1">Repository URL</label>
                    <input type="url" name="repository" required
                        class="block w-full px-3 py-2 bg-dark-bg border border-dark-border rounded-md text-dark-text focus:outline-none focus:ring-2 focus:ring-accent-500"
                        placeholder="https://github.com/user/repo.git">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-dark-muted mb-1">Branch</label>
                        <input type="text" name="branch" value="main"
                            class="block w-full px-3 py-2 bg-dark-bg border border-dark-border rounded-md text-dark-text focus:outline-none focus:ring-2 focus:ring-accent-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-dark-muted mb-1">Project Type</label>
                        <select name="type" required
                            class="block w-full px-3 py-2 bg-dark-bg border border-dark-border rounded-md text-dark-text focus:outline-none focus:ring-2 focus:ring-accent-500">
                            <option value="laravel">Laravel</option>
                            <option value="nodejs">Node.js</option>
                            <option value="python">Python</option>
                            <option value="static">Static</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-dark-muted mb-1">Deploy Path</label>
                    <input type="text" name="path" required
                        class="block w-full px-3 py-2 bg-dark-bg border border-dark-border rounded-md text-dark-text focus:outline-none focus:ring-2 focus:ring-accent-500"
                        placeholder="/var/www/my-app">
                </div>
                <div>
                    <label class="block text-sm font-medium text-dark-muted mb-1">Target (Agent or SSH)</label>
                    <select name="target"
                        class="block w-full px-3 py-2 bg-dark-bg border border-dark-border rounded-md text-dark-text focus:outline-none focus:ring-2 focus:ring-accent-500">
                        <option value="">Select target...</option>
                        {{range .Agents}}
                        <option value="agent:{{.ID}}">Agent: {{.Name}}</option>
                        {{end}}
                        <option value="ssh:localhost">SSH: localhost</option>
                    </select>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-dark-border flex justify-end space-x-3">
                <button type="button" onclick="document.getElementById('new-project-modal').classList.add('hidden')"
                    class="px-4 py-2 text-sm font-medium text-dark-muted hover:text-white border border-dark-border rounded-md">
                    Cancel
                </button>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-accent-600 hover:bg-accent-700 rounded-md">
                    Create Project
                </button>
            </div>
        </form>
    </div>
</div>
{{end}}
